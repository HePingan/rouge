(()=>{const frame=document.getElementById('game'),out=document.getElementById('result');const sleep=ms=>new Promise(r=>setTimeout(r,ms));const w=()=>frame.contentWindow,d=()=>w().document;function fail(m){throw new Error(m)}function assert(c,m){if(!c)fail(m)}async function waitFor(fn,label,timeout=10000){const end=Date.now()+timeout;let last;while(Date.now()<end){try{last=fn();if(last)return last}catch(e){last=e.message}await sleep(80)}fail('timeout '+label+' last='+JSON.stringify(last))}function tap(el){assert(el,'tap target missing');const win=w(),r=el.getBoundingClientRect();const init={bubbles:true,cancelable:true,composed:true,view:win,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerId:84,pointerType:'touch',isPrimary:true};try{el.dispatchEvent(new win.PointerEvent('pointerdown',init));el.dispatchEvent(new win.PointerEvent('pointerup',init))}catch(_){}el.dispatchEvent(new win.MouseEvent('click',init))}const metrics={};function state(label){const s=w().eval(`({label:'${label}',enemyHp:currentEnemy?.hp||0,enemyMaxHp:currentEnemy?.maxHp||0,isBoss:!!currentEnemy?.isBoss,weaponTrait:player.equipment.weapon?.trait||null,bossDmg:getEquipmentAbility('bossDmg'),log:combatLogBuffer.map(e=>e.text).join('\\n'),combatText:document.querySelector('#combat-dom-panel')?.textContent||'',body:document.body.className,overflowX:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),errors:(window.__p84Errors||[]).slice()})`);metrics[label]=s;if(s.overflowX>1)fail(label+' overflow '+JSON.stringify(s));if(s.errors.length)fail(label+' errors '+s.errors.join(' || '));return s}async function run(){await waitFor(()=>w().gameReady,'gameReady');w().__p84Errors=[];w().addEventListener('error',e=>w().__p84Errors.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||0)));w().addEventListener('unhandledrejection',e=>w().__p84Errors.push(String(e.reason||'unhandledrejection')));w().eval(`closeAllPanels(); if(typeof isInStageRun!=='undefined') isInStageRun=false; combatState=COMBAT_STATE.IDLE; currentEnemy=null; learnedSkills=[]; const item=generateEquipment(20,{rarityName:'传说',slot:'weapon',traitId:'pojun'}); player.equipment.weapon=item; player.inventory=[]; player.atk=120; player.hp=player.maxHp; player.recalcStats(); const boss=createScaledEnemy({name:'试炼首领',title:'试炼首领',symbol:'首',color:'#ff5555',isBoss:true,affix:false,hp:420,atk:1,def:20,xp:1,stones:1,x:5,y:5}, 20, {affix:false}); currentEnemy=boss; startCombat(boss); Math.random=()=>0.6;`);await waitFor(()=>d().querySelector('#cbt-attack'),'attack button');const before=state('before');assert(before.weaponTrait&&before.weaponTrait.id==='pojun','pojun should be equipped '+JSON.stringify(before));assert(before.isBoss,'enemy should be boss '+JSON.stringify(before));assert(before.bossDmg>0,'boss damage stat should be active '+JSON.stringify(before));tap(d().querySelector('#cbt-attack'));await waitFor(()=>w().eval('combatLogBuffer.some(e=>/破军首领伤害/.test(e.text))'),'pojun combat log');const after=state('after');assert(after.enemyHp<before.enemyHp,'boss hp should drop '+JSON.stringify({before,after}));assert(/破军首领伤害\+/.test(after.log),'combat log should expose trait damage '+after.log);assert(/破军首领伤害\+/.test(after.combatText),'combat panel should render trait damage '+after.combatText);return{ok:true,message:'p84 trait combat feedback smoke passed',metrics}}
run().then(r=>{out.textContent='SMOKE_RESULT:'+JSON.stringify(r);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}).catch(()=>{})}).catch(e=>{const payload={ok:false,message:e.message,stack:e.stack,metrics};try{payload.state=state('failed')}catch(_){}out.textContent='SMOKE_RESULT:'+JSON.stringify(payload);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})})})();
