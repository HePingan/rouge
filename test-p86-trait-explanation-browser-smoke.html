(()=>{const frame=document.getElementById('game'),out=document.getElementById('result');const sleep=ms=>new Promise(r=>setTimeout(r,ms));const w=()=>frame.contentWindow,d=()=>w().document;function fail(m){throw new Error(m)}function assert(c,m){if(!c)fail(m)}async function waitFor(fn,label,timeout=10000){const end=Date.now()+timeout;let last;while(Date.now()<end){try{last=fn();if(last)return last}catch(e){last=e.message}await sleep(80)}fail('timeout '+label+' last='+JSON.stringify(last))}function tap(el){assert(el,'tap target missing');const win=w(),r=el.getBoundingClientRect();const init={bubbles:true,cancelable:true,composed:true,view:win,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerId:86,pointerType:'touch',isPrimary:true};try{el.dispatchEvent(new win.PointerEvent('pointerdown',init));el.dispatchEvent(new win.PointerEvent('pointerup',init))}catch(_){}el.dispatchEvent(new win.MouseEvent('click',init))}const metrics={};function state(label){const s=w().eval(`({label:'${label}',inventoryText:document.querySelector('#inventory-dom-panel')?.textContent||'',characterText:document.querySelector('#character-dom-panel')?.textContent||'',traitMeta:[...document.querySelectorAll('.trait-meta')].map(n=>n.textContent.trim()),equipped:!!player.equipment.weapon?.trait,stack:[...panelStack],body:document.body.className,overflowX:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),errors:(window.__p86Errors||[]).slice()})`);metrics[label]=s;if(s.overflowX>1)fail(label+' overflow '+JSON.stringify(s));if(s.errors.length)fail(label+' errors '+s.errors.join(' || '));return s}async function run(){await waitFor(()=>w().gameReady,'gameReady');w().__p86Errors=[];w().addEventListener('error',e=>w().__p86Errors.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||0)));w().addEventListener('unhandledrejection',e=>w().__p86Errors.push(String(e.reason||'unhandledrejection')));w().eval(`closeAllPanels(); if(typeof isInStageRun!=='undefined') isInStageRun=false; combatState=COMBAT_STATE.IDLE; currentEnemy=null; player.equipment={}; player.inventory=[]; learnedSkills=[]; availableSkillPoints=4; const item=generateEquipment(20,{rarityName:'传说',slot:'weapon',traitId:'guiyuan'}); player.inventory.push(item); if(typeof invalidateInventoryListCacheDom==='function') invalidateInventoryListCacheDom(); player.recalcStats();`);w().openPanel('inventory');await waitFor(()=>d().querySelector('#inventory-dom-panel .bag-item-card,[data-inv-index]'),'bag card');tap(d().querySelector('#inventory-dom-panel .bag-item-card,[data-inv-index]'));await waitFor(()=>/来源：/.test(d().querySelector('#inventory-dom-panel')?.textContent||''),'trait source detail');let s=state('detail');assert(/来源：/.test(s.inventoryText)&&/战斗定位：/.test(s.inventoryText)&&/闭环：背包查看/.test(s.inventoryText),'inventory trait explanation missing '+JSON.stringify(s));assert(/回灵反馈/.test(s.inventoryText),'guiyuan battle explanation missing '+s.inventoryText);tap(await waitFor(()=>d().querySelector('[data-equip-action-index]'),'equip preview'));tap(await waitFor(()=>d().querySelector('[data-confirm-equip-index]'),'equip confirm'));await waitFor(()=>w().eval('!!player.equipment.weapon?.trait'),'equipped trait');w().openPanel('character');await waitFor(()=>/归元特质适合/.test(d().querySelector('#character-dom-panel')?.textContent||''),'character trait hint');s=state('character');assert(/水系续航/.test(s.characterText)&&/回合恢复时显示归元回灵/.test(s.characterText),'character should explain trait combat position '+s.characterText);assert(s.equipped,'trait item should remain equipped '+JSON.stringify(s));return{ok:true,message:'p86 trait explanation smoke passed',metrics}}
run().then(r=>{out.textContent='SMOKE_RESULT:'+JSON.stringify(r);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}).catch(()=>{})}).catch(e=>{const payload={ok:false,message:e.message,stack:e.stack,metrics};try{payload.state=state('failed')}catch(_){}out.textContent='SMOKE_RESULT:'+JSON.stringify(payload);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})})})();
