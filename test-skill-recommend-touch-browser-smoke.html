<!doctype html>
<meta charset="utf-8">
<title>skill recommend touch browser smoke</title>
<style>
  html, body { margin:0; background:#111; color:#eee; font:12px sans-serif; }
  .phone { width:390px; height:844px; overflow:hidden; }
  iframe { width:390px; height:844px; border:0; display:block; }
</style>
<div class="phone"><iframe id="game" src="./index.html?v=20260606safearea6"></iframe></div>
<pre id="result">RUNNING</pre>
<script>
(() => {
  const resultEl = document.getElementById('result');
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const fail = message => { throw new Error(message); };
  const assert = (condition, message) => { if (!condition) fail(message); };
  function gameWindow() { return document.getElementById('game').contentWindow; }
  function gameDocument() { return gameWindow().document; }
  function rectData(el) { const r = el.getBoundingClientRect(); return { x:r.x, y:r.y, w:r.width, h:r.height, bottom:r.bottom, right:r.right }; }
  function pointerTap(el, dx = 0, dy = 0) {
    assert(el, 'tap target missing');
    const w = gameWindow();
    const r = el.getBoundingClientRect();
    const init = { bubbles: true, cancelable: true, view: w, clientX: r.left + r.width / 2 + dx, clientY: r.top + r.height / 2 + dy, pointerId: 9, pointerType: 'touch', isPrimary: true };
    el.dispatchEvent(new PointerEvent('pointerdown', init));
    el.dispatchEvent(new PointerEvent('pointerup', init));
    el.dispatchEvent(new MouseEvent('click', init));
  }
  async function waitFor(predicate, label, timeout = 7000) {
    const end = Date.now() + timeout;
    let last;
    while (Date.now() < end) {
      try { last = predicate(); if (last) return last; } catch (err) { last = err.message; }
      await sleep(80);
    }
    fail(`timed out waiting for ${label}; last=${JSON.stringify(last)}`);
  }
  function inspect() {
    const d = gameDocument();
    const w = gameWindow();
    const strip = d.querySelector('.synergy-recommend-strip');
    const btn = d.querySelector('.synergy-recommend-strip button');
    const titleHint = d.querySelector('.synergy-title small');
    return {
      bodyClass: d.body.className,
      skillsOpen: d.body.classList.contains('skills-open'),
      detailVisible: !!d.querySelector('#skill-detail-layer .skill-detail-modal'),
      selected: w.eval('typeof selectedSkillTreeNode !== "undefined" ? selectedSkillTreeNode : null'),
      strip: strip ? { ...rectData(strip), scrollW: strip.scrollWidth, clientW: strip.clientWidth, overflowY: getComputedStyle(strip).overflowY } : null,
      btn: btn ? { ...rectData(btn), text: btn.textContent.trim(), scrollH: btn.scrollHeight, clientH: btn.clientHeight, whiteSpace: getComputedStyle(btn).whiteSpace } : null,
      titleHint: titleHint ? { text: titleHint.textContent.trim(), scrollH: titleHint.scrollHeight, clientH: titleHint.clientHeight, whiteSpace: getComputedStyle(titleHint).whiteSpace, overflow: getComputedStyle(titleHint).overflow } : null,
      consoleErrors: w.__skillRecommendSmokeErrors || [],
    };
  }
  async function run() {
    const w = gameWindow();
    await waitFor(() => w.gameReady === true, 'gameReady');
    w.__skillRecommendSmokeErrors = [];
    w.addEventListener('error', e => w.__skillRecommendSmokeErrors.push(e.message || 'error'));
    w.addEventListener('unhandledrejection', e => w.__skillRecommendSmokeErrors.push(String(e.reason || 'unhandledrejection')));
    await waitFor(() => w.eval('typeof getRecommendedSkillNodesForBuild === "function" && typeof renderSkillsDomPanel === "function"'), 'skill recommendation globals');
    w.eval(`
      learnedSkills = [];
      selectedSkillTreeNode = null;
      skillDetailModalOpen = false;
      openPanel('skills');
    `);
    await waitFor(() => gameDocument().body.classList.contains('skills-open'), 'skills panel open');
    const recBtn = await waitFor(() => gameDocument().querySelector('.synergy-recommend-strip button'), 'recommended skill button');
    const before = inspect();
    assert(before.btn.clientH >= 40, `recommend button should be tall enough for wrapped text: ${JSON.stringify(before.btn)}`);
    assert(before.btn.whiteSpace === 'normal', `recommend button text should wrap: ${JSON.stringify(before.btn)}`);
    assert(before.titleHint.whiteSpace === 'normal' && before.titleHint.overflow === 'visible', `synergy title hint should not be clipped: ${JSON.stringify(before.titleHint)}`);
    for (let i = 0; i < 5; i += 1) {
      const btn = await waitFor(() => gameDocument().querySelector('.synergy-recommend-strip button'), `recommended skill ${i}`);
      pointerTap(btn, (i % 3) - 1, ((i + 1) % 3) - 1);
      await waitFor(() => gameDocument().querySelector('#skill-detail-layer .skill-detail-modal'), `detail after recommend ${i}`);
      const state = inspect();
      assert(state.skillsOpen, `recommended skill tap must not close skills panel ${i}: ${JSON.stringify(state)}`);
      assert(state.detailVisible, `recommended skill tap should open detail ${i}: ${JSON.stringify(state)}`);
      w.eval('skillDetailModalOpen = false; renderSkillsDomPanel();');
      await waitFor(() => !gameDocument().querySelector('#skill-detail-layer .skill-detail-modal'), `detail reset ${i}`);
    }
    const state = inspect();
    assert(!state.consoleErrors.length, `console should stay clean: ${state.consoleErrors.join('\n')}`);
    return { ok: true, message: 'skill recommend touch browser smoke passed', state };
  }
  run().then(result => { resultEl.textContent = 'SMOKE_RESULT:' + JSON.stringify(result); document.title = 'SMOKE_OK'; })
    .catch(err => { resultEl.textContent = 'SMOKE_RESULT:' + JSON.stringify({ ok:false, message: err.message, stack: err.stack, state: (() => { try { return inspect(); } catch (_) { return null; } })() }); document.title = 'SMOKE_FAIL'; });
})();
</script>
