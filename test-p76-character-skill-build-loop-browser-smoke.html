<!doctype html>
<html><head><meta charset="utf-8"><title>P76 character skill build loop smoke</title><style>body{margin:0;background:#111;color:#d6ffd6;font:12px monospace}iframe{width:390px;height:844px;border:0;display:block}pre{white-space:pre-wrap;max-width:390px}</style></head>
<body><iframe id="game" src="./index.html?v=20260605combatp3"></iframe><pre id="result">running</pre>
<script>
const frame=document.getElementById('game'); const result=document.getElementById('result'); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function post(text){try{fetch('/__p76_skill_build_loop_result',{method:'POST',headers:{'Content-Type':'text/plain'},body:text})}catch(_){}}
async function waitFor(fn,label,timeout=10000){const start=Date.now();let last;while(Date.now()-start<timeout){try{const v=fn();if(v)return v;}catch(e){last=e}await sleep(80)}throw new Error('timeout waiting for '+label+(last?': '+last.message:''));}
function tap(win,el){if(!el)throw new Error('missing tap target');const r=el.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;const opts={bubbles:true,cancelable:true,composed:true,clientX:x,clientY:y,pointerId:76,pointerType:'touch',isPrimary:true};try{el.dispatchEvent(new win.PointerEvent('pointerdown',opts));}catch(_){}try{el.dispatchEvent(new win.PointerEvent('pointerup',opts));}catch(_){}el.dispatchEvent(new win.MouseEvent('click',opts));}
function visible(win,el){if(!el)return false;const cs=win.getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>4&&r.height>4;}
function overflowX(win){return Math.max(0,win.document.documentElement.scrollWidth-win.innerWidth)}
function panelState(win){return win.eval(`(() => ({ body:[...document.body.classList].join(' '), stack:Array.isArray(panelStack)?panelStack.slice():[], selected:typeof selectedSkillTreeNode!=='undefined'?selectedSkillTreeNode:null, modal:!!skillDetailModalOpen, learned:learnedSkills.map(s=>s.tree+':'+s.index), skillPoints:availableSkillPoints, charHtml:characterPanelLastHtml.length, visiblePanels:[...document.querySelectorAll('#character-dom-panel,#skills-dom-panel,#inventory-dom-panel,#stage-dom-panel,#ascension-dom-panel')].filter(el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&r.width>4&&r.height>4}).map(el=>el.id), overflowX:Math.max(0,document.documentElement.scrollWidth-innerWidth) }))()`);}
(async()=>{const metrics={};try{const win=frame.contentWindow;await waitFor(()=>win&&win.gameReady,'gameReady');await sleep(300);win.__p76Errors=[];const oldErr=win.console.error;win.console.error=(...a)=>{win.__p76Errors.push(a.map(String).join(' '));oldErr.apply(win.console,a)};
  metrics.seed=win.eval(`(() => { closeAllPanels(); combatState=COMBAT_STATE.IDLE; if(typeof isInStageRun!=='undefined') isInStageRun=false; learnedSkills=[]; claimedSkillSynergies={}; claimedSkillMasteries={}; availableSkillPoints=12; availableStatPoints=0; player.realmIndex=Math.max(player.realmIndex||0,8); selectedSkillTreeNode=null; skillDetailModalOpen=false; characterPanelLastHtml=''; const layer=document.getElementById('skill-detail-layer'); if(layer) layer.innerHTML=''; if(typeof player.recalcStats==='function') player.recalcStats(); return {skillPoints:availableSkillPoints, learned:learnedSkills.length, realmIndex:player.realmIndex, recs:(typeof getRecommendedSkillNodesForBuild==='function'?getRecommendedSkillNodesForBuild(2):[]).map(r=>({tree:r.tree,index:r.index,label:r.label||r.name}))}; })()`);
  const charBtn=await waitFor(()=>win.document.getElementById('btn-character'),'character nav'); tap(win,charBtn); await waitFor(()=>win.document.body.classList.contains('character-open'),'character open'); await sleep(260);
  const charBefore=await waitFor(()=>win.document.getElementById('character-dom-panel'),'character panel'); metrics.characterBefore={state:panelState(win), text:charBefore.textContent.slice(0,900)};
  const jump=await waitFor(()=>win.document.querySelector('#character-dom-panel [data-char-build-jump]'),'character build skill jump'); metrics.jump={text:jump.textContent.trim(), tree:jump.dataset.tree, index:Number(jump.dataset.index), rect:(()=>{const r=jump.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom}})()}; tap(win,jump); await sleep(450);
  await waitFor(()=>win.document.body.classList.contains('skills-open')&&!win.document.body.classList.contains('character-open'),'skills opened from character');
  await waitFor(()=>win.document.querySelector('#skill-detail-layer .skill-detail-modal'),'skill detail modal'); metrics.afterJump={state:panelState(win), modalText:win.document.querySelector('#skill-detail-layer .skill-detail-modal')?.textContent.slice(0,800)||'', selectedNode:win.document.querySelector('#skills-dom-panel .skill-node.selected')?.textContent.slice(0,240)||'', overflowX:overflowX(win)};
  const learn=await waitFor(()=>win.document.querySelector('#skill-detail-layer .skill-learn-btn:not([disabled]), #skills-dom-panel .skill-learn-btn:not([disabled])'),'learn skill button'); metrics.learnButton={text:learn.textContent.trim(), tree:learn.dataset.tree, index:Number(learn.dataset.index)}; tap(win,learn); await sleep(500);
  metrics.afterLearn={state:panelState(win), modalText:win.document.querySelector('#skill-detail-layer .skill-detail-modal')?.textContent.slice(0,800)||'', closeHit:null};
  const close=await waitFor(()=>win.document.querySelector('#skill-detail-layer .skill-modal-close'),'skill detail close'); const cr=close.getBoundingClientRect(); const hit=win.document.elementFromPoint(cr.left+cr.width/2,cr.top+cr.height/2); metrics.afterLearn.closeHit=hit?.className||hit?.tagName||''; tap(win,close); await sleep(300); await waitFor(()=>!win.document.querySelector('#skill-detail-layer .skill-detail-modal'),'skill detail closed');
  const charAgain=await waitFor(()=>win.document.getElementById('btn-character'),'character nav after learn'); tap(win,charAgain); await sleep(420); await waitFor(()=>win.document.body.classList.contains('character-open')&&!win.document.body.classList.contains('skills-open'),'returned character');
  const charAfter=await waitFor(()=>win.document.getElementById('character-dom-panel'),'character panel after'); metrics.afterCharacter={state:panelState(win), text:charAfter.textContent.slice(0,1000), consoleErrors:(win.__p76Errors||[]).filter(e=>!/Failed to load resource/.test(e))};
  const issues=[];
  if(!metrics.jump.tree||Number.isNaN(metrics.jump.index))issues.push('jump target missing tree/index');
  if(metrics.jump.rect.w<40||metrics.jump.rect.h<28)issues.push('jump touch target too small '+JSON.stringify(metrics.jump.rect));
  if(metrics.afterJump.state.body.indexOf('skills-open')<0||metrics.afterJump.state.body.indexOf('character-open')>=0)issues.push('bad body after jump '+metrics.afterJump.state.body);
  if(!metrics.afterJump.state.modal)issues.push('skill detail did not open from character jump');
  if(!metrics.afterJump.state.selected||metrics.afterJump.state.selected.tree!==metrics.jump.tree||Number(metrics.afterJump.state.selected.index)!==metrics.jump.index)issues.push('selected node mismatch after jump');
  if(metrics.afterJump.overflowX>1)issues.push('skills overflow after jump');
  const learnedKey=metrics.learnButton.tree+':'+metrics.learnButton.index;
  if(!metrics.afterLearn.state.learned.includes(learnedKey))issues.push('learnedSkills missing '+learnedKey);
  if(metrics.afterLearn.state.skillPoints>=metrics.seed.skillPoints)issues.push('skill point not spent');
  if(!String(metrics.afterLearn.modalText).includes('已习得')&&!String(metrics.afterLearn.modalText).includes('已领悟')&&!String(metrics.afterLearn.modalText).includes('化道归虚'))issues.push('modal did not refresh learned state');
  if(!String(metrics.afterLearn.closeHit).includes('skill-modal-close'))issues.push('skill modal close is not top hit target: '+metrics.afterLearn.closeHit);
  if(metrics.afterCharacter.state.visiblePanels.length!==1||metrics.afterCharacter.state.visiblePanels[0]!=='character-dom-panel')issues.push('visible panels after return wrong '+metrics.afterCharacter.state.visiblePanels.join(','));
  if(metrics.afterCharacter.state.modal)issues.push('skill modal state remains after return');
  if(!metrics.afterCharacter.text.includes('流派')||!metrics.afterCharacter.text.includes('技能页'))issues.push('character build/next-action text missing after learn');
  if(!metrics.afterCharacter.state.learned.includes(learnedKey)||!metrics.afterCharacter.text.includes('悟道 11'))issues.push('character build progress did not reflect learned skill');
  if(metrics.afterCharacter.state.overflowX>1)issues.push('character overflow after learn');
  if(metrics.afterCharacter.consoleErrors.length)issues.push('console errors: '+metrics.afterCharacter.consoleErrors.slice(0,3).join(' || '));
  if(issues.length)throw new Error(issues.join('; ')+' '+JSON.stringify(metrics));
  document.body.dataset.result='passed';document.body.dataset.metrics=JSON.stringify(metrics);result.textContent='p76 character skill build loop smoke passed '+JSON.stringify(metrics);post(result.textContent);frame.remove();
}catch(err){document.body.dataset.result='failed';result.textContent='p76 character skill build loop smoke failed '+(err&&err.stack||err)+'\n'+JSON.stringify(metrics,null,2);post(result.textContent);frame.remove();}})();
</script></body></html>
