<!doctype html><html><head><meta charset="utf-8"><title>P85 defensive trait combat feedback smoke</title><style>body{margin:0;background:#111;color:#d6ffd6;font:12px monospace}iframe{width:390px;height:844px;border:0;display:block}pre{white-space:pre-wrap;font-size:11px;max-width:390px}</style></head><body><iframe id="game" src="./index.html?v=20260606safearea4"></iframe><pre id="result">RUNNING</pre><script>
(()=>{const frame=document.getElementById('game'),out=document.getElementById('result');const sleep=ms=>new Promise(r=>setTimeout(r,ms));const w=()=>frame.contentWindow,d=()=>w().document;function fail(m){throw new Error(m)}function assert(c,m){if(!c)fail(m)}async function waitFor(fn,label,timeout=12000){const end=Date.now()+timeout;let last;while(Date.now()<end){try{last=fn();if(last)return last}catch(e){last=e.message}await sleep(80)}fail('timeout '+label+' last='+JSON.stringify(last))}function tap(el){assert(el,'tap target missing');const win=w(),r=el.getBoundingClientRect();const init={bubbles:true,cancelable:true,composed:true,view:win,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerId:85,pointerType:'touch',isPrimary:true};try{el.dispatchEvent(new win.PointerEvent('pointerdown',init));el.dispatchEvent(new win.PointerEvent('pointerup',init))}catch(_){}el.dispatchEvent(new win.MouseEvent('click',init))}const metrics={};function state(label){const s=w().eval(`({label:'${label}',hp:player.hp,maxHp:player.maxHp,mp:player.mp,maxMp:player.maxMp,log:combatLogBuffer.map(e=>e.text).join('\\n'),combatText:document.querySelector('#combat-dom-panel')?.textContent||'',stack:[...panelStack],body:document.body.className,overflowX:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),errors:(window.__p85Errors||[]).slice()})`);metrics[label]=s;if(s.overflowX>1)fail(label+' overflow '+JSON.stringify(s));if(s.errors.length)fail(label+' errors '+s.errors.join(' || '));return s}async function seedTrait(id,slot='weapon',randomValue=0.9){w().eval(`closeAllPanels(); if(typeof isInStageRun!=='undefined') isInStageRun=false; combatState=COMBAT_STATE.IDLE; currentEnemy=null; learnedSkills=[]; player.equipment={}; player.inventory=[]; player.hp=player.maxHp; player.mp=Math.max(0, player.maxMp-18); const item=generateEquipment(20,{rarityName:'传说',slot:'${slot}',traitId:'${id}'}); player.equipment['${slot}']=item; player.recalcStats(); const enemy=createScaledEnemy({name:'木桩妖',title:'木桩妖',symbol:'妖',color:'#88dd88',affix:false,hp:999,atk:18,def:0,xp:1,stones:1,x:5,y:5,skillIds:[]}, 1, {affix:false}); currentEnemy=enemy; startCombat(enemy); currentEnemy._nextIntent={type:'attack',icon:'⚔️',label:'普攻',attackType:'normal',suggestion:'可防御',detail:'测试普攻'}; Math.random=()=>${randomValue};`);await waitFor(()=>d().querySelector('#cbt-defend'),'defend button '+id)}async function defendAndWait(pattern,label){const before=state(label+'Before');tap(d().querySelector('#cbt-defend'));await waitFor(()=>w().eval(`combatLogBuffer.some(e=>${pattern}.test(e.text))`),label+' log');await sleep(80);const after=state(label+'After');assert(new RegExp(pattern.source||pattern).test(after.log),'log missing '+label+' '+after.log);assert(new RegExp(pattern.source||pattern).test(after.combatText),'dom missing '+label+' '+after.combatText);return{before,after}}async function run(){await waitFor(()=>w().gameReady,'gameReady');w().__p85Errors=[];w().addEventListener('error',e=>w().__p85Errors.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||0)));w().addEventListener('unhandledrejection',e=>w().__p85Errors.push(String(e.reason||'unhandledrejection')));
await seedTrait('guiyuan','weapon',0.9);const g=await defendAndWait(/归元回灵/,'guiyuan');assert(g.after.mp>g.before.mp,'guiyuan should restore mp '+JSON.stringify(g));
await seedTrait('jiying','boots',0.0);const j=await defendAndWait(/疾影身法/,'jiying');assert(j.after.hp===j.before.hp,'jiying dodge should avoid damage '+JSON.stringify(j));
await seedTrait('tieshan','armor',0.9);const t=await defendAndWait(/铁山减伤/,'tieshan');assert(t.after.hp<t.before.hp,'tieshan should still take reduced damage '+JSON.stringify(t));
return{ok:true,message:'p85 defensive trait combat feedback smoke passed',metrics}}
run().then(r=>{out.textContent='SMOKE_RESULT:'+JSON.stringify(r);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}).catch(()=>{})}).catch(e=>{const payload={ok:false,message:e.message,stack:e.stack,metrics};try{payload.state=state('failed')}catch(_){}out.textContent='SMOKE_RESULT:'+JSON.stringify(payload);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})})})();
</script></body></html>
