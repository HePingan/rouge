<!doctype html><html><head><meta charset="utf-8"><title>P89 poison intent status smoke</title><style>body{margin:0;background:#111;color:#d6ffd6;font:12px monospace}iframe{width:390px;height:844px;border:0;display:block}pre{white-space:pre-wrap;font-size:11px;max-width:390px}</style></head><body><iframe id="game" src="./index.html?v=20260606safearea4"></iframe><pre id="result">RUNNING</pre><script>
(()=>{const frame=document.getElementById('game'),out=document.getElementById('result');const sleep=ms=>new Promise(r=>setTimeout(r,ms));const w=()=>frame.contentWindow,d=()=>w().document;function fail(m){throw new Error(m)}function assert(c,m){if(!c)fail(m)}async function waitFor(fn,label,timeout=12000){const end=Date.now()+timeout;let last;while(Date.now()<end){try{last=fn();if(last)return last}catch(e){last=e.message}await sleep(80)}fail('timeout '+label+' last='+JSON.stringify(last))}function tap(el){assert(el,'tap target missing');const win=w(),r=el.getBoundingClientRect();const init={bubbles:true,cancelable:true,composed:true,view:win,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerId:89,pointerType:'touch',isPrimary:true};try{el.dispatchEvent(new win.PointerEvent('pointerdown',init));el.dispatchEvent(new win.PointerEvent('pointerup',init))}catch(_){}el.dispatchEvent(new win.MouseEvent('click',init))}const metrics={};function state(label){const s=w().eval(`({label:'${label}',hp:player.hp,maxHp:player.maxHp,combatState,log:combatLogBuffer.map(e=>e.text).join('\\n'),combatText:document.querySelector('#combat-dom-panel')?.textContent||'',intent:currentEnemy?._nextIntent?{label:currentEnemy._nextIntent.label,suggestion:currentEnemy._nextIntent.suggestion,detail:currentEnemy._nextIntent.detail}:null,playerStatus:(player._statusEffects||[]).map(s=>({type:s.type,turns:s.turns,ratio:s.ratio,sourceAtk:s.sourceAtk})),overflowX:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),errors:(window.__p89Errors||[]).slice()})`);metrics[label]=s;if(s.overflowX>1)fail(label+' overflow '+JSON.stringify(s));if(s.errors.length)fail(label+' errors '+s.errors.join(' || '));return s}async function run(){frame.style.width='390px';frame.style.height='844px';await waitFor(()=>w().player&&w().startCombat&&w().getMonsterSkill&&d().querySelector('#combat-dom-panel')!==undefined,'load');w().eval(`window.__p89Errors=[];window.addEventListener('error',e=>__p89Errors.push(e.message));Math.random=()=>0.99;closeAllPanels();isInStageRun=false;learnedSkills=[];player.hp=player.maxHp;player.mp=player.maxMp;player._statusEffects=[];const venom=getMonsterSkill('venomFang');const e={name:'毒蝠',title:'毒蝠',symbol:'毒',hp:112,maxHp:112,atk:40,def:6,xp:1,stones:1,color:'#99dd66',skillIds:['venomFang'],weaknesses:['fire','thunder'],resists:['wood'],_statusEffects:[],_skillCooldowns:{},_buffs:[]};startCombat(e);renderCombatDomPanel();`);await waitFor(()=>/施毒/.test(state('intent').combatText),'poison intent');let s=state('intent-ready');assert(s.intent&&s.intent.label==='施毒','intent label should be 施毒 '+JSON.stringify(s.intent));assert(/无驱散技能，建议防御/.test(s.combatText),'should show no-cleanse defend hint '+s.combatText);assert(/每回合约/.test(s.intent.detail),'intent detail should include dot estimate '+JSON.stringify(s.intent));const hpBefore=s.hp;tap(d().querySelector('#cbt-defend'));await waitFor(()=>state('after-hit').playerStatus.some(x=>x.type==='poison'),'poison applied');s=state('poison-status');assert(/中毒/.test(s.combatText)&&/-\d+\/回/.test(s.combatText),'status chip should show poison dot per turn '+s.combatText);assert(/每回合损失/.test(s.log),'combat log should explain dot loss '+s.log);const hpPoisoned=s.hp;tap(d().querySelector('#cbt-defend'));await waitFor(()=>state('after-dot').hp<hpPoisoned,'poison dot tick');s=state('dot-ticked');assert(/☠️ 中毒造成/.test(s.log),'dot tick log missing '+s.log);return{ok:true,message:'p89 poison intent status smoke passed',metrics}}run().then(r=>{out.textContent='SMOKE_RESULT:'+JSON.stringify(r);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}).catch(()=>{})}).catch(e=>{const payload={ok:false,message:e.message,stack:e.stack,metrics};try{payload.state=state('failed')}catch(_){}out.textContent='SMOKE_RESULT:'+JSON.stringify(payload);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})})})();
</script></body></html>
