<!doctype html>
<html><head><meta charset="utf-8"><title>P79 panel backstack audit</title><style>body{margin:0;background:#111;color:#d6ffd6;font:12px monospace}iframe{width:390px;height:844px;border:0;display:block}pre{white-space:pre-wrap;font-size:11px;max-width:390px}</style></head><body><iframe id="game" src="./index.html?v=20260606safearea6"></iframe><pre id="result">RUNNING</pre><script>
(()=>{
const frame=document.getElementById('game'), out=document.getElementById('result');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const w=()=>frame.contentWindow, d=()=>w().document;
function fail(m){throw new Error(m)} function assert(c,m){if(!c)fail(m)}
async function waitFor(fn,label,timeout=9000){const end=Date.now()+timeout;let last;while(Date.now()<end){try{last=fn();if(last)return last}catch(e){last=e.message}await sleep(80)}fail('timeout '+label+' last='+JSON.stringify(last))}
function tap(el){assert(el,'tap target missing');const win=w(),r=el.getBoundingClientRect();const init={bubbles:true,cancelable:true,composed:true,view:win,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerId:79,pointerType:'touch',isPrimary:true};try{el.dispatchEvent(new win.PointerEvent('pointerdown',init));el.dispatchEvent(new win.PointerEvent('pointerup',init))}catch(_){}el.dispatchEvent(new win.MouseEvent('click',init))}
function visiblePanels(){return [...d().querySelectorAll('#inventory-dom-panel,#character-dom-panel,#skills-dom-panel,#stage-dom-panel,#secretrealm-dom-panel,#ascension-dom-panel,#combat-dom-panel')].filter(el=>{const cs=w().getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>4&&r.height>4}).map(el=>el.id)}
function state(label){const s=w().eval(`({stack:Array.isArray(panelStack)?panelStack.slice():[],body:document.body.className,visible:[...document.querySelectorAll('#inventory-dom-panel,#character-dom-panel,#skills-dom-panel,#stage-dom-panel,#secretrealm-dom-panel,#ascension-dom-panel,#combat-dom-panel')].filter(el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>4&&r.height>4}).map(el=>el.id),skillModal:!!skillDetailModalOpen,inventoryDetail:!!inventoryDetailTarget,characterHint:characterEquipmentSlotHint||null,stageDetail:!!stageDetailOpen,panelOpen:document.body.classList.contains('panel-open'),movementBlocked:typeof isMovementBlockedByUi==='function'?isMovementBlockedByUi():null,overflowX:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),errors:(window.__p79Errors||[]).slice()})`);metrics[label]=s;if(s.overflowX>1)fail(label+' overflow '+JSON.stringify(s));if(s.errors.length)fail(label+' errors '+s.errors.slice(0,3).join(' || '));if(s.visible.length>1)fail(label+' multiple visible panels '+JSON.stringify(s));return s}
async function openBtn(id,cls){const el=await waitFor(()=>d().getElementById(id),'#'+id);tap(el);await waitFor(()=>d().body.classList.contains(cls),cls);return state('open-'+id)}
async function openMore(){const more=d().getElementById('btn-more');if(more){tap(more);await sleep(120)}}
async function skillBackstack(){w().eval(`closeAllPanels(); if(typeof isInStageRun!=='undefined') isInStageRun=false; learnedSkills=[]; availableSkillPoints=12; selectedSkillTreeNode=null; skillDetailModalOpen=false; characterPanelLastHtml=''; syncBodyPanelState();`);await openBtn('btn-character','character-open');const jump=await waitFor(()=>d().querySelector('[data-char-build-jump]'),'char build jump');tap(jump);await waitFor(()=>d().body.classList.contains('skills-open')&&d().querySelector('#skill-detail-layer .skill-detail-modal'),'skill detail');let s=state('skills-after-char-jump');assert(s.stack.length===1&&s.stack[0]==='skills','skill jump should replace character stack '+JSON.stringify(s));const close=await waitFor(()=>d().querySelector('.skill-modal-close'),'skill modal close');tap(close);await sleep(160);s=state('skills-after-modal-close');assert(s.visible[0]==='skills-dom-panel'&&!s.skillModal,'closing skill modal should keep skills panel only '+JSON.stringify(s));tap(d().getElementById('btn-character'));await waitFor(()=>d().body.classList.contains('character-open'),'return character');s=state('character-after-skill-return');assert(s.stack.length===1&&s.stack[0]==='character','returning to character should not keep stale skills stack '+JSON.stringify(s));assert(!s.skillModal&&!s.inventoryDetail,'return character should not retain modal/detail '+JSON.stringify(s));}
async function equipmentBackstack(){w().eval(`closeAllPanels(); if(typeof isInStageRun!=='undefined') isInStageRun=false; player.equipment.armor=null; player.inventory=[{name:'P79护甲',slot:'armor',rarity:'传说',rarityColor:'#f6c453',stats:{def:77,maxHp:177},floorLevel:77},{name:'P79错位剑',slot:'weapon',rarity:'传说',rarityColor:'#f6c453',stats:{atk:77},floorLevel:77}]; inventoryTab='equipment'; inventorySlotFilter=''; inventoryDetailTarget=null; characterEquipmentSlotHint=null; characterEquipmentDetailSlot=null; characterPanelLastHtml=''; if(typeof invalidateInventoryListCacheDom==='function') invalidateInventoryListCacheDom(); syncBodyPanelState();`);await openBtn('btn-character','character-open');tap(await waitFor(()=>d().querySelector('#character-dom-panel .char-equip-card.empty[data-char-equip-slot="armor"]'),'empty armor'));tap(await waitFor(()=>d().querySelector('[data-char-open-inventory-slot="armor"]'),'armor inv cta'));await waitFor(()=>d().body.classList.contains('inventory-open'),'inventory open');let s=state('inventory-from-character');assert(s.stack.length===1&&s.stack[0]==='inventory','inventory from character should not keep character stack '+JSON.stringify(s));tap(await waitFor(()=>[...d().querySelectorAll('#inventory-dom-panel .bag-item-card')].find(el=>el.textContent.includes('P79护甲')),'armor card'));await waitFor(()=>d().querySelector('[data-equip-action-index]'),'equip action');s=state('inventory-detail-open');assert(s.inventoryDetail,'inventory detail should be open before equip');tap(d().querySelector('[data-equip-action-index]'));tap(await waitFor(()=>d().querySelector('[data-confirm-equip-index]'),'confirm equip'));await waitFor(()=>d().body.classList.contains('character-open')&&!d().body.classList.contains('inventory-open'),'returned char equip');s=state('character-after-equip');assert(s.stack.length===1&&s.stack[0]==='character','equip return should leave only character stack '+JSON.stringify(s));assert(!s.inventoryDetail&&!s.characterHint,'equip return should clear detail/hint '+JSON.stringify(s));}
async function ascensionRunCleanup(){w().eval(`closeAllPanels(); if(typeof isInStageRun!=='undefined') isInStageRun=false; combatState=COMBAT_STATE.IDLE; currentEnemy=null; player.stageProgress=normalizeStageProgress(player.stageProgress||{}); Object.keys(STAGES||{}).forEach(id=>{player.stageProgress.unlockedStages[id]=true;player.stageProgress.clearedStages[id]=true;player.stageProgress.stageStars[id]=3}); player.stageProgress.currentRun=null; player.realmIndex=Math.max(player.realmIndex||0,99); syncBodyPanelState();`);await openMore();await openBtn('btn-ascension','ascension-open');tap(await waitFor(()=>d().querySelector('[data-asc-resource-source]'),'asc source'));await waitFor(()=>d().body.classList.contains('stage-open'),'stage detail');let s=state('stage-after-asc-source');assert(s.stack.length===1&&s.stack[0]==='stages'&&s.stageDetail,'asc source should show one stage detail '+JSON.stringify(s));tap(await waitFor(()=>d().querySelector('[data-stage-enter]:not([disabled])'),'stage enter'));await waitFor(()=>d().body.classList.contains('stage-run-active'),'stage run active');s=state('stage-run-after-source-enter');assert(s.stack.length===0&&!s.panelOpen&&!s.movementBlocked&&!s.stageDetail,'stage enter should clear stack/panel/detail and unblock movement '+JSON.stringify(s));}
const metrics={};
async function run(){await waitFor(()=>w().gameReady,'gameReady');w().__p79Errors=[];w().addEventListener('error',e=>w().__p79Errors.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||0)));w().addEventListener('unhandledrejection',e=>w().__p79Errors.push(String(e.reason||'unhandledrejection')));await skillBackstack();await equipmentBackstack();await ascensionRunCleanup();return {ok:true,message:'p79 panel backstack audit passed',metrics}}
run().then(r=>{out.textContent='SMOKE_RESULT:'+JSON.stringify(r);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}).catch(()=>{})}).catch(e=>{const payload={ok:false,message:e.message,stack:e.stack,metrics};try{payload.state=state('failed');payload.visiblePanels=visiblePanels()}catch(_){}out.textContent='SMOKE_RESULT:'+JSON.stringify(payload);fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})});
})();
</script></body></html>
