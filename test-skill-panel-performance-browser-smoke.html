<!doctype html>
<meta charset="utf-8">
<title>skill panel performance browser smoke</title>
<style>
  html, body { margin:0; background:#111; color:#eee; font:12px sans-serif; }
  .phone { width:390px; height:844px; overflow:hidden; }
  iframe { width:390px; height:844px; border:0; display:block; }
</style>
<div class="phone"><iframe id="game" src="./index.html?v=20260606safearea1"></iframe></div>
<pre id="result">RUNNING</pre>
<script>
(() => {
  const resultEl = document.getElementById('result');
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const fail = message => { throw new Error(message); };
  const assert = (condition, message) => { if (!condition) fail(message); };
  function gameWindow() { return document.getElementById('game').contentWindow; }
  function gameDocument() { return gameWindow().document; }
  function pointerTap(el, dx = 0, dy = 0) {
    assert(el, 'tap target missing');
    const w = gameWindow();
    const r = el.getBoundingClientRect();
    const init = { bubbles: true, cancelable: true, view: w, clientX: r.left + r.width / 2 + dx, clientY: r.top + r.height / 2 + dy, pointerId: Math.floor(Math.random() * 1000) + 1, pointerType: 'touch', isPrimary: true };
    el.dispatchEvent(new PointerEvent('pointerdown', init));
    el.dispatchEvent(new PointerEvent('pointerup', init));
    el.dispatchEvent(new MouseEvent('click', init));
  }
  async function waitFor(predicate, label, timeout = 7000) {
    const end = Date.now() + timeout;
    let last;
    while (Date.now() < end) {
      try { last = predicate(); if (last) return last; } catch (err) { last = err.message; }
      await sleep(50);
    }
    fail(`timed out waiting for ${label}; last=${JSON.stringify(last)}`);
  }
  function rect(el) { const r = el.getBoundingClientRect(); return { x:r.x, y:r.y, w:r.width, h:r.height, bottom:r.bottom, right:r.right }; }
  function inspect(extra = {}) {
    const d = gameDocument();
    const w = gameWindow();
    const body = d.querySelector('.skills-panel-body');
    const panel = d.querySelector('#skills-dom-panel');
    const layer = d.querySelector('#skill-detail-layer');
    return {
      ...extra,
      bodyClass: d.body.className,
      skillsOpen: d.body.classList.contains('skills-open'),
      detailVisible: !!d.querySelector('#skill-detail-layer .skill-detail-modal'),
      panel: panel ? rect(panel) : null,
      body: body ? { ...rect(body), scrollTop: body.scrollTop, scrollH: body.scrollHeight, clientH: body.clientHeight } : null,
      nodeCount: d.querySelectorAll('.skill-node').length,
      recommendCount: d.querySelectorAll('.synergy-recommend-strip button').length,
      synergyCards: d.querySelectorAll('.synergy-card').length,
      layerChildren: layer ? layer.children.length : -1,
      listenerRoots: {
        skillPanel: !!d.getElementById('skills-dom-panel'),
        detailLayer: !!d.getElementById('skill-detail-layer'),
      },
      selected: w.eval('typeof selectedSkillTreeNode !== "undefined" ? selectedSkillTreeNode : null'),
      consoleErrors: w.__skillPerfSmokeErrors || [],
    };
  }
  async function run() {
    const w = gameWindow();
    await waitFor(() => w.gameReady === true, 'gameReady');
    w.__skillPerfSmokeErrors = [];
    w.addEventListener('error', e => w.__skillPerfSmokeErrors.push(e.message || 'error'));
    w.addEventListener('unhandledrejection', e => w.__skillPerfSmokeErrors.push(String(e.reason || 'unhandledrejection')));
    await waitFor(() => w.eval('typeof renderSkillsDomPanel === "function" && typeof getRecommendedSkillNodesForBuild === "function"'), 'skill globals');
    w.eval(`
      learnedSkills = [];
      claimedSkillSynergies = {};
      claimedSkillMasteries = {};
      availableSkillPoints = 30;
      availableStatPoints = 12;
      selectedSkillTreeNode = null;
      skillDetailModalOpen = false;
      openPanel('skills');
    `);
    await waitFor(() => gameDocument().body.classList.contains('skills-open'), 'skills panel open');
    const renderTimes = w.eval(`(() => {
      const out = [];
      for (let i = 0; i < 60; i += 1) {
        const t0 = performance.now();
        renderSkillsDomPanel();
        out.push(performance.now() - t0);
      }
      return out;
    })()`);
    const sorted = renderTimes.slice().sort((a,b) => a-b);
    const avg = renderTimes.reduce((a,b) => a+b, 0) / renderTimes.length;
    const p95 = sorted[Math.floor(sorted.length * 0.95)];
    assert(avg < 18, `skill render avg too slow: ${avg.toFixed(2)}ms, p95=${p95.toFixed(2)}ms`);
    assert(p95 < 40, `skill render p95 too slow: avg=${avg.toFixed(2)}ms, p95=${p95.toFixed(2)}ms`);

    const d = gameDocument();
    const body = await waitFor(() => d.querySelector('.skills-panel-body'), 'skills panel body');
    const maxScroll = Math.max(0, body.scrollHeight - body.clientHeight);
    for (let i = 0; i < 8; i += 1) {
      body.scrollTop = Math.round(maxScroll * (i / 7));
      await sleep(16);
      const btn = d.querySelectorAll('.synergy-recommend-strip button')[i % Math.max(1, d.querySelectorAll('.synergy-recommend-strip button').length)] || d.querySelectorAll('.skill-node')[i % d.querySelectorAll('.skill-node').length];
      pointerTap(btn, (i % 3) - 1, ((i + 1) % 3) - 1);
      await waitFor(() => d.body.classList.contains('skills-open'), `skills still open ${i}`);
      if (d.querySelector('#skill-detail-layer .skill-detail-modal')) {
        w.eval('skillDetailModalOpen = false; renderSkillsDomPanel();');
        await waitFor(() => !d.querySelector('#skill-detail-layer .skill-detail-modal'), `detail closed ${i}`);
      }
    }
    const after = inspect({ avgRenderMs: Number(avg.toFixed(2)), p95RenderMs: Number(p95.toFixed(2)) });
    assert(after.skillsOpen, `skills panel should remain open after stress taps: ${JSON.stringify(after)}`);
    assert(after.nodeCount >= 25, `all skill nodes should render: ${JSON.stringify(after)}`);
    assert(after.recommendCount >= 1, `recommend buttons should render: ${JSON.stringify(after)}`);
    assert(!after.consoleErrors.length, `console should stay clean: ${after.consoleErrors.join('\n')}`);
    return { ok: true, message: `skill panel performance smoke passed avg=${after.avgRenderMs}ms p95=${after.p95RenderMs}ms`, state: after };
  }
  run().then(result => { resultEl.textContent = 'SMOKE_RESULT:' + JSON.stringify(result); document.title = 'SMOKE_OK'; })
    .catch(err => { resultEl.textContent = 'SMOKE_RESULT:' + JSON.stringify({ ok:false, message: err.message, stack: err.stack, state: (() => { try { return inspect(); } catch (_) { return null; } })() }); document.title = 'SMOKE_FAIL'; });
})();
</script>
