<html><head><meta charset="utf-8"><title>P72 movement gating browser smoke</title><style>body{margin:0;background:#111;color:#d6ffd6;font:12px monospace}iframe{width:390px;height:844px;border:0;display:block}pre{white-space:pre-wrap;max-width:390px}</style></head>
<body><iframe id="game" src="./index.html?v=20260606safearea1"></iframe><pre id="result">running</pre>
<script>

async function waitFor(fn,label,timeout=10000){const start=Date.now();let last;while(Date.now()-start<timeout){try{const v=fn();if(v)return v;}catch(e){last=e}await sleep(80)}throw new Error('timeout waiting for '+label+(last?': '+last.message:''));}

(async()=>{const metrics={};try{const win=frame.contentWindow;await waitFor(()=>win&&win.gameReady,'gameReady');await sleep(300);win.__p72Errors=[];const oldErr=win.console.error;win.console.error=(...a)=>{win.__p72Errors.push(a.map(String).join(' '));oldErr.apply(win.console,a)};
  metrics.before=win.eval(`(() => { closeAllPanels(); combatState=COMBAT_STATE.IDLE; if(typeof openPanel==='function') openPanel('inventory'); return {stack: typeof panelStack!=='undefined'?panelStack.slice():[], panelOpen: document.body.classList.contains('panel-open'), inventoryOpen: document.body.classList.contains('inventory-open')}; })()`);
  metrics.enter=win.eval(`(() => { const id=Object.keys(STAGES||{})[0]; enterStage(id); return {id, isInStageRun, panelStack: typeof panelStack!=='undefined'?panelStack.slice():[], panelOpen: document.body.classList.contains('panel-open'), stageRun: document.body.classList.contains('stage-run-active'), blocked: isMovementBlockedByUi(), body:[...document.body.classList].join(' ')}; })()`);

  metrics.afterDown=win.eval(`(() => ({active:joystick.active, dx:joystick.dx, dy:joystick.dy, distance:joystick.distance, blocked:isMovementBlockedByUi(), body:[...document.body.classList].join(' ')}))()`);

  metrics.motion=win.eval(`(() => { const start={x:player.x,y:player.y}; let blockedFrames=0; for(let i=0;i<48;i++){const bx=player.x,by=player.y; currentFrameDt=1/60; handleInput(); updateCamera(); if(Math.abs(player.x-bx)+Math.abs(player.y-by)<0.0001) blockedFrames++;} return {moved:Number((Math.abs(player.x-start.x)+Math.abs(player.y-start.y)).toFixed(3)), blockedFrames, active:joystick.active, body:[...document.body.classList].join(' ')}; })()`);
  dispatchPointer(win,touch,'pointerup',x+64,y+8); await sleep(80);
