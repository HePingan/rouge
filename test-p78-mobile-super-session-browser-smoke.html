<!doctype html>
<html><head><meta charset="utf-8"><title>P78 mobile super session smoke</title><style>body{margin:0;background:#111;color:#d6ffd6;font:12px monospace}iframe{width:390px;height:844px;border:0;display:block}pre{white-space:pre-wrap;font-size:11px;max-width:390px}</style></head><body><iframe id="game" src="./index.html?v=20260607safearea12"></iframe><pre id="result">RUNNING</pre><script>
(()=>{
const resultEl=document.getElementById('result');
const frame=document.getElementById('game');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fail=m=>{throw new Error(m)};
const assert=(c,m)=>{if(!c)fail(m)};
const w=()=>frame.contentWindow;
const d=()=>w().document;
async function waitFor(fn,label,timeout=9000){const end=Date.now()+timeout;let last;while(Date.now()<end){try{last=fn();if(last)return last}catch(e){last=e.message}await sleep(80)}fail('timed out waiting for '+label+'; last='+JSON.stringify(last))}
function tap(el){assert(el,'tap target missing');const win=w();const r=el.getBoundingClientRect();const init={bubbles:true,cancelable:true,view:win,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerId:29,pointerType:'touch',isPrimary:true};el.dispatchEvent(new win.PointerEvent('pointerdown',init));el.dispatchEvent(new win.PointerEvent('pointerup',init));el.dispatchEvent(new win.MouseEvent('click',init))}
function visiblePanels(){return [...d().querySelectorAll('#inventory-dom-panel,#character-dom-panel,#skills-dom-panel,#stage-dom-panel,#secretrealm-dom-panel,#ascension-dom-panel,#combat-dom-panel')].filter(el=>{const cs=w().getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0}).map(el=>el.id)}
function state(){return w().eval(`({body:document.body.className, stack:Array.isArray(panelStack)?panelStack.slice():[], inRun:!!isInStageRun, currentRun:player.stageProgress?.currentRun?.stageId||null, inCombat:isInCombat(), selectedStageId:typeof selectedStageId!=='undefined'?selectedStageId:null, selectedSkillTreeNode:typeof selectedSkillTreeNode!=='undefined'?selectedSkillTreeNode:null, skillModal:!!skillDetailModalOpen, learned:(learnedSkills||[]).map(s=>s.tree+':'+s.index), skillPoints:availableSkillPoints, inventoryCount:player.inventory.length, overflowX:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth), movementBlocked:typeof isMovementBlockedByUi==='function'?isMovementBlockedByUi():null})`)}
function assertClean(label){const s=state();metrics[label]=s;if(s.overflowX>1)fail(label+' overflowX '+s.overflowX+' '+JSON.stringify(s));const errs=w().__p78Errors||[];if(errs.length)fail(label+' console errors '+errs.slice(0,3).join(' || '));return s}
async function openMore(){const more=d().getElementById('btn-more');if(more){tap(more);await sleep(120)}}
async function openBtn(id, cls){const btn=d().getElementById(id);assert(btn,'missing '+id);tap(btn);await waitFor(()=>d().body.classList.contains(cls),cls)}
async function moveFrames(count=180){const start=w().eval('({x:player.x,y:player.y})');w().eval(`joystick.active=true; joystick.dx=0.92; joystick.dy=0.24; joystick.distance=1;`);for(let i=0;i<count;i++){w().eval(`currentFrameDt=1/60; handleInput(); updateCamera(); if(typeof drawDungeon==='function') drawDungeon(); if(${i}%20===0&&typeof updateHUD==='function') updateHUD(player,dungeonLevel);`);if(i%50===0)await sleep(0)}w().eval(`if(typeof window.__resetMovementTouchInput==='function') window.__resetMovementTouchInput('p78-super-session');`);const end=w().eval('({x:player.x,y:player.y})');return {start,end,moved:Number((Math.abs(end.x-start.x)+Math.abs(end.y-start.y)).toFixed(3))}}
async function combatStep(){w().eval(`closeAllPanels(); currentEnemy={name:'长链路木桩',hp:300,maxHp:300,attack:1,defense:1,speed:1,realm:'炼气期',level:1,intent:{type:'attack',label:'普攻',desc:'长链路测试'}}; combatState=COMBAT_STATE.PLAYER_TURN; combatLogBuffer=[]; syncBodyPanelState(); renderCombatDomPanel();`);await waitFor(()=>visiblePanels().includes('combat-dom-panel'),'combat visible');tap(d().getElementById('cbt-attack'));await sleep(260);const after=w().eval(`({hp:currentEnemy?.hp||0,combat:document.body.classList.contains('combat-active'), log:document.querySelectorAll('.cbt-log-entry').length})`);assert(after.hp<300,'attack did not damage enemy '+JSON.stringify(after));assert(after.combat,'combat-active missing after attack');w().eval(`combatState=COMBAT_STATE.IDLE; currentEnemy=null; syncBodyPanelState(); renderCombatDomPanel();`);await sleep(120);return after}
async function equipStep(){w().eval(`closeAllPanels(); combatState=COMBAT_STATE.IDLE; currentEnemy=null; if(typeof isInStageRun!=='undefined') isInStageRun=false; player.equipment.armor=null; player.inventory=[]; player.inventory.push({id:'p78_armor',name:'P78长链路护甲',slot:'armor',rarity:'传说',rarityColor:'#f6c453',level:99,floorLevel:99,stats:{def:99,maxHp:300},setName:'长链路'}); player.inventory.push({id:'p78_weapon',name:'P78错位武器',slot:'weapon',rarity:'传说',rarityColor:'#f6c453',level:99,floorLevel:99,stats:{atk:99}}); inventoryTab='equipment'; inventorySlotFilter=''; inventoryDetailTarget=null; characterEquipmentSlotHint=null; characterEquipmentDetailSlot=null; characterPanelLastHtml=''; if(typeof invalidateInventoryListCacheDom==='function') invalidateInventoryListCacheDom(); syncBodyPanelState();`);await openBtn('btn-character','character-open');const empty=d().querySelector('[data-char-equip-slot="armor"]');assert(empty,'armor slot missing');tap(empty);await waitFor(()=>d().querySelector('[data-char-open-inventory-slot="armor"]'),'armor CTA');tap(d().querySelector('[data-char-open-inventory-slot="armor"]'));await waitFor(()=>d().body.classList.contains('inventory-open'),'inventory from char');const card=await waitFor(()=>[...d().querySelectorAll('#inventory-dom-panel .bag-item-card,[data-inv-index]')].find(el=>el.textContent.includes('P78长链路护甲')),'p78 armor card');tap(card);await waitFor(()=>d().querySelector('[data-equip-action-index]'),'equip action');tap(d().querySelector('[data-equip-action-index]'));await waitFor(()=>d().querySelector('[data-confirm-equip-index]'),'confirm equip');tap(d().querySelector('[data-confirm-equip-index]'));await waitFor(()=>d().body.classList.contains('character-open'),'character after equip');const res=w().eval(`({equipped:player.equipment.armor?.name||'', inv:player.inventory.map(it=>it.name), text:document.querySelector('#character-dom-panel')?.textContent||''})`);assert(res.equipped==='P78长链路护甲','armor not equipped '+JSON.stringify(res));assert(!res.inv.includes('P78长链路护甲')&&res.inv.includes('P78错位武器'),'inventory mutation wrong '+JSON.stringify(res));assert(!res.text.includes('护甲槽为空'),'stale armor hint remains');return res}
async function skillStep(){w().eval(`closeAllPanels(); if(typeof isInStageRun!=='undefined') isInStageRun=false; learnedSkills=[]; availableSkillPoints=12; selectedSkillTreeNode=null; skillDetailModalOpen=false; characterPanelLastHtml=''; syncBodyPanelState();`);await openBtn('btn-character','character-open');const jump=await waitFor(()=>d().querySelector('[data-char-build-jump]'),'build jump');tap(jump);await waitFor(()=>d().body.classList.contains('skills-open')&&d().querySelector('#skill-detail-layer .skill-detail-modal'),'skill detail');const btn=await waitFor(()=>d().querySelector('.skill-learn-btn:not(:disabled)'),'learn skill');const target={tree:btn.dataset.tree,index:Number(btn.dataset.index)};tap(btn);await waitFor(()=>w().eval(`(learnedSkills||[]).some(s=>s.tree==='${target.tree}'&&s.index===${target.index})`),'skill learned');const close=d().querySelector('.skill-modal-close');tap(close);await sleep(120);tap(d().getElementById('btn-character'));await waitFor(()=>d().body.classList.contains('character-open'),'character after skill');const res=w().eval(`({learned:(learnedSkills||[]).map(s=>s.tree+':'+s.index), points:availableSkillPoints, modal:!!skillDetailModalOpen, text:document.querySelector('#character-dom-panel')?.textContent||''})`);assert(res.learned.includes(target.tree+':'+target.index)&&res.points===11&&!res.modal,'skill learn/return wrong '+JSON.stringify(res));assert(res.text.includes('悟道 11'),'character did not refresh skill points');return res}
async function ascensionSourceStep(){w().eval(`closeAllPanels(); combatState=COMBAT_STATE.IDLE; currentEnemy=null; if(typeof isInStageRun!=='undefined') isInStageRun=false; if(typeof isInStageRun!=='undefined') isInStageRun=false; player.stageProgress=normalizeStageProgress(player.stageProgress||{}); Object.keys(STAGES||{}).forEach(id=>{player.stageProgress.unlockedStages[id]=true;player.stageProgress.clearedStages[id]=true;player.stageProgress.stageStars[id]=3;}); player.stageProgress.currentRun=null; player.realmIndex=Math.max(player.realmIndex||0,99); syncBodyPanelState();`);await openMore();await openBtn('btn-ascension','ascension-open');const src=await waitFor(()=>d().querySelector('[data-asc-resource-source]'),'asc source');const stageId=src.dataset.ascResourceSource;tap(src);await waitFor(()=>d().body.classList.contains('stage-open'),'stage source detail');const enter=await waitFor(()=>d().querySelector('[data-stage-enter]:not([disabled])'),'enabled stage enter');tap(enter);await waitFor(()=>d().body.classList.contains('stage-run-active'),'stage run from source');const res=state();assert(res.currentRun===stageId,'asc source stage mismatch '+JSON.stringify({stageId,res}));assert(!res.movementBlocked,'movement blocked after asc source');return {stageId,res}}
const metrics={};
async function run(){await waitFor(()=>w().gameReady===true,'gameReady');w().__p78Errors=[];w().addEventListener('error',e=>w().__p78Errors.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||0)+':' +(e.colno||0)+' '+(e.error&&e.error.stack||'')));w().addEventListener('unhandledrejection',e=>w().__p78Errors.push(String(e.reason||'unhandledrejection')));await waitFor(()=>w().eval('typeof openPanel==="function"&&typeof renderCombatDomPanel==="function"&&typeof normalizeStageProgress==="function"'),'globals');
w().eval(`closeAllPanels(); combatState=COMBAT_STATE.IDLE; currentEnemy=null; if(typeof isInStageRun!=='undefined') isInStageRun=false; player.stageProgress=normalizeStageProgress(player.stageProgress||{}); const first=Object.keys(STAGES||{})[0]; player.stageProgress.currentRun={stageId:first,roomIndex:0,turns:0}; isInStageRun=true; syncBodyPanelState(); if(typeof generateNewFloor==='function') generateNewFloor(); if(typeof updateMapVisibilityIfNeeded==='function') updateMapVisibilityIfNeeded(true);`);
await waitFor(()=>d().body.classList.contains('stage-run-active'),'initial run');metrics.initialRun=assertClean('initialRun');metrics.move1=await moveFrames(220);assert(metrics.move1.moved>0.5,'initial movement too small '+JSON.stringify(metrics.move1));metrics.afterMove=assertClean('afterMove');metrics.combat=await combatStep();assertClean('afterCombatCleanup');metrics.equip=await equipStep();assertClean('afterEquip');metrics.skill=await skillStep();assertClean('afterSkill');metrics.ascension=await ascensionSourceStep();assertClean('afterAscensionSource');metrics.move2=await moveFrames(160);assert(metrics.move2.moved>0.5,'final movement too small '+JSON.stringify(metrics.move2));assertClean('afterFinalMove');const issues=[];if((w().__p78Errors||[]).length)issues.push('console errors');if(issues.length)fail(issues.join('; '));return {ok:true,message:'p78 mobile super session smoke passed',metrics};}
run().then(r=>{resultEl.textContent='SMOKE_RESULT:'+JSON.stringify(r);document.title='SMOKE_OK';fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}).catch(()=>{})}).catch(err=>{const payload={ok:false,message:err.message,stack:err.stack,metrics};try{payload.state=state();payload.visiblePanels=visiblePanels()}catch(_){}resultEl.textContent='SMOKE_RESULT:'+JSON.stringify(payload);document.title='SMOKE_FAIL';fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})});
})();
</script></body></html>
